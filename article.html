<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>文章 - SKBOJ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <a href="/">首页</a> | <a href="/rp">测试数字</a> | <a href="/rank">用户</a> | <a href="/prize">荣誉</a> | <a href="/article">文章</a> | <a href="/admin">管理</a>
    <span id="userInfo" style="float:right"></span>
  </nav>
  <div class="container">
    <h1>文章列表</h1>
    <button onclick="showNewArticleForm()" style="margin-bottom: 20px;">+ 新建文章</button>
    
    <div id="newArticleArea" style="display:none; text-align:left; background:#1a1f2b; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h3>新建文章</h3>
      <input id="artTitle" placeholder="文章标题（最多20字）" maxlength="20" style="width:100%; max-width:100%; margin-bottom:10px;">
      <textarea id="artContent" placeholder="正文（支持 Markdown，$$包裹公式$$，最多1000字）" maxlength="1000" rows="8" style="width:100%; max-width:100%; margin-bottom:10px;"></textarea>
      <button id="publishBtn" onclick="saveArticle()">发布</button>
      <button onclick="document.getElementById('newArticleArea').style.display='none'" style="color:#a0aec0; border-color:#a0aec0;">取消</button>
    </div>

    <div id="articleList" style="text-align:left;">加载中...</div>
  </div>
  <script src="/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
