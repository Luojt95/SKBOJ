<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>文章详情 - SKBOJ</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Markdown 渲染 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
  <!-- KaTeX 渲染公式 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.8/katex.min.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.8/katex.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/markdown-it-katex/2.0.3/markdown-it-katex.min.js"></script>
  <style>
    .markdown-body { line-height: 1.8; font-size: 16px; text-align: left; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5em; }
    .markdown-body pre { background: #0d0f12; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #2a303c; }
    .markdown-body code { font-family: monospace; color: #00f3ff; background: #0d0f12; padding: 2px 6px; border-radius: 4px; }
    .markdown-body blockquote { border-left: 4px solid #00f3ff; padding-left: 15px; color: #a0aec0; margin: 0; }
  
    /* 强制覆盖 Markdown 文字颜色，防止看不清 */
    .markdown-body, .markdown-body p, .markdown-body li, .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6, .markdown-body strong, .markdown-body em {
      color: #e2e8f0 !important;
    }
    .markdown-body a {
      color: #00f3ff !important;
      text-decoration: underline;
    }
    .markdown-body blockquote {
      background: rgba(0, 243, 255, 0.1) !important;
      border-left: 4px solid #00f3ff !important;
      padding: 10px 15px !important;
      color: #cbd5e0 !important;
      margin: 15px 0;
    }
    .markdown-body pre {
      background: #1a1f2b !important;
      padding: 15px !important;
      border-radius: 8px !important;
      border: 1px solid #2a303c !important;
      overflow-x: auto !important;
    }
    .markdown-body code {
      font-family: monospace !important;
      color: #00f3ff !important;
      background: rgba(0, 243, 255, 0.15) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
    }
    .markdown-body pre code {
      background: transparent !important;
      padding: 0 !important;
    }

  </style>
</head>
<body>
  <nav>
    <a href="/">首页</a> | <a href="/rp">测试数字</a> | <a href="/rank">用户</a> | <a href="/prize">荣誉</a> | <a href="/article">文章</a> | <a href="/admin">管理</a>
    <span id="userInfo" style="float:right"></span>
  </nav>
  <div class="container">
    <h1 id="artTitle">加载中...</h1>
    <p id="artMeta" style="color:#a0aec0; font-size:14px; border-bottom:1px solid #2a303c; padding-bottom:10px;"></p>
    <div id="articleActions" style="display:none; margin: 15px 0;">
      <button onclick="showEditForm()" style="font-size:14px; padding:6px 12px;">编辑</button>
      <button onclick="deleteArticle()" style="font-size:14px; padding:6px 12px; color:#ff4d4d; border-color:#ff4d4d;">删除</button>
    </div>
    <div id="editArticleArea" style="display:none; text-align:left; background:#1a1f2b; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h3>编辑文章</h3>
      <input id="editArtTitle" placeholder="文章标题（最多20字）" maxlength="20" style="width:100%; max-width:100%; margin-bottom:10px;">
      <textarea id="editArtContent" placeholder="正文" maxlength="1000" rows="8" style="width:100%; max-width:100%; margin-bottom:10px;"></textarea>
      <button onclick="saveEditArticle()">保存</button>
      <button onclick="document.getElementById('editArticleArea').style.display='none'; document.getElementById('artContent').style.display='block';" style="color:#a0aec0; border-color:#a0aec0;">取消</button>
    </div>
    <div id="artContent" class="markdown-body"></div>
    <p style="margin-top:40px;"><a href="/article">← 返回文章列表</a></p>
  </div>
  <script src="/supabase.js"></script>
  <script src="/app.js"></script>
</body>
</html>
