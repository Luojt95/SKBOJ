<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><title>工具库 - SKBOJ</title>
  <link rel="icon" type="image/svg+xml" href="/skboj-icon.svg?v=2">
  <link rel="stylesheet" href="/style.css">
  <style>
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .app-card { background: #1a1f2b; border: 1px solid #2a303c; border-radius: 8px; padding: 20px; transition: transform 0.2s, border-color 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
    .app-card:hover { transform: translateY(-5px); border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    .app-card h3 { color: #00f3ff; margin-top: 0; }
    .app-card p { color: #a0aec0; font-size: 14px; margin-bottom: 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/">首页</a> | <a href="/rank">用户</a> | <a href="/article">文章</a> | <a href="/app">工具库</a> | <a href="/admin">管理</a>
    <span id="userInfo" style="float:right"></span>
  </nav>
  <div class="container">
    <h1>OIer 的工具库</h1>
    <p>实用工具集合，持续更新中...</p>
    <div class="app-grid">
      <a href="/app/number" class="app-card">
        <h3>数字性质 (Number Properties)</h3>
        <p>测试任意数字的稀有度与命中的特殊性质。</p>
      </a>
    </div>
  </div>
  <script src="/supabase.js"></script>
  <script src="/app.js"></script>
</body>
</html>
